<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper · Sidney Deep Paper Reader</title>
  <link rel="stylesheet" href="assets/style.css?v=webapp-1" />
</head>
<body class="app-shell paper-page" data-page="paper">
  <aside class="rail">
    <a class="back-link" href="index.html">← Library</a>
    <div class="brand"><div class="brand-logo">AI</div><div><strong>Ask While Reading</strong><span>single paper</span></div></div>
  </aside>
  <main class="workspace paper-workspace">
    <header id="paper-hero" class="paper-hero"></header>
    <section class="paper-layout">
      <article id="paper-content" class="paper-content"></article>
      <aside class="paper-chat panel">
        <div class="panel-title"><h3>Ask While Reading</h3><span id="chat-status" class="status-badge">ready</span></div>
        <div class="prompt-row vertical">
          <button class="prompt-chip" data-prompt="请用中文解释这篇论文的核心问题、方法和贡献，适合我快速读懂。">中文讲解</button>
          <button class="prompt-chip" data-prompt="请拆解这篇论文的方法：输入、模型/算法、实验设置、关键假设分别是什么？">方法拆解</button>
          <button class="prompt-chip" data-prompt="请总结这篇论文的主要实验结果、指标、对比方法，以及最重要的表格/图。">实验结果</button>
          <button class="prompt-chip" data-prompt="请批判性分析这篇论文的局限性、可能的偏差、威胁有效性的因素。">局限性</button>
          <button class="prompt-chip" data-prompt="请说明这篇论文和我的 LLM bias / BBQ / MultilingualBBQ / fairness evaluation 博士课题有什么关系，可以怎么引用或扩展？">和我的 PhD 关系</button>
          <button class="prompt-chip" data-prompt="请提炼这篇论文作为 related work 时可引用的 3-5 个点，并给出中文说明。">Related Work 可引用点</button>
        </div>
        <div id="chat-log" class="chat-log compact"><div class="bubble assistant">我会带上这篇论文的 metadata / fulltext excerpt / related papers 来回答。</div></div>
        <form id="chat-form" class="composer paper-composer"><textarea id="chat-question" placeholder="Ask about this paper…" rows="2"></textarea><button type="submit">Ask</button></form>
      </aside>
    </section>
  </main>
  <script src="assets/app.js?v=webapp-1"></script>
</body>
</html>
