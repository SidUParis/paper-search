<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Admin · __SITE_TITLE__</title><link rel="stylesheet" href="assets/style.css?v=multi-1" /></head>
<body class="reader-app" data-page="admin"><aside class="sidebar" data-nav></aside><main class="main-frame"><header class="masthead compact"><div><p class="eyebrow">Operations</p><h1>Sync Dashboard</h1><p class="lead">One-click update from arXiv / ACL / Scholar, run full-text sync, regenerate the private reader site, and inspect job logs.</p></div></header><section class="settings-card admin-card"><div class="settings-grid"><label>Topic<input id="admin-topic" value="bias-fairness" /></label><label>Source<select id="admin-source"><option value="all">All sources</option><option value="acl">ACL</option><option value="arxiv">arXiv</option><option value="scholar">Scholar</option></select></label><label>Limit<input id="admin-limit" type="number" value="50" min="1" max="1000" /></label><label>Max results<input id="admin-max-results" type="number" value="50" min="1" max="500" /></label></div><div class="action-grid"><button data-job-action="update">Update selected topic</button><button data-job-action="update-all">Update all topics</button><button data-job-action="fulltext">Extract/summarize fulltext</button><button data-job-action="regenerate">Regenerate site</button><button data-job-action="fulltext-and-regenerate">Fulltext + regenerate</button><button data-refresh-jobs="1">Refresh jobs</button></div></section><section class="settings-card"><div class="section-head"><span>Recent jobs</span><strong id="job-status-title">idle</strong></div><div id="job-list" class="job-list"></div><pre id="job-output" class="job-output"></pre></section></main><script src="assets/app.js?v=multi-1"></script></body></html>
